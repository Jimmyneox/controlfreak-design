<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 768" class="cf-demo-object c01-cold-plunge " data-object="c01-cold-plunge">
<style>
.cf-demo-object{display:block;width:100%;height:auto}
.cf-demo-object .ov{opacity:0;transition:opacity .6s ease}
.cf-demo-object #water{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s ease}
@keyframes cfShimmer{0%{transform:translateX(-12px)}50%{transform:translateX(12px)}100%{transform:translateX(-12px)}}
@keyframes cfPulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes cfRise{0%{transform:translateY(0)}100%{transform:translateY(-20px)}}
@keyframes cfRipple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes cfSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.cf-demo-object .shimmer{animation:cfShimmer 4s ease-in-out infinite}
.cf-demo-object.swim-off *{animation-play-state:paused!important}
.cf-demo-object #water-tint{fill:#2aa8ff;opacity:.30;transition:fill .8s,opacity .8s}
.cf-demo-object.temp-neutral #water-tint{fill:#7fd6c8;opacity:.12}
.cf-demo-object.chiller-on #mist{opacity:1}
.cf-demo-object.chiller-on #mist .puff{animation:cfRise 4s ease-in-out infinite alternate}
.cf-demo-object.chiller-on #flow{opacity:.7}
.cf-demo-object.chiller-on #flow .ring{transform-box:fill-box;transform-origin:50% 50%;animation:cfRipple 3s ease-out infinite}
.cf-demo-object.power-on #led-power,.cf-demo-object.power-on #display{opacity:1}
.cf-demo-object.chiller-on #led-chiller{opacity:1;animation:cfPulse 2s infinite}
.cf-demo-object #chromo,.cf-demo-object #chromo-fixtures,.cf-demo-object #chromo-rim,.cf-demo-object #led-chromo{opacity:0;transition:opacity .8s ease}
.cf-demo-object.chromo-on #chromo,.cf-demo-object.power-on:not(.chromo-off) #chromo{opacity:1}
.cf-demo-object.chromo-on #chromo-fixtures,.cf-demo-object.power-on:not(.chromo-off) #chromo-fixtures{opacity:1}
.cf-demo-object.chromo-on #chromo-rim,.cf-demo-object.power-on:not(.chromo-off) #chromo-rim{opacity:1}
.cf-demo-object.chromo-on #led-chromo,.cf-demo-object.power-on:not(.chromo-off) #led-chromo{opacity:1}
.cf-demo-object .cc{fill:#1e6bff;transition:fill .8s ease}
@keyframes cfChromo{0%{fill:#1e6bff}20%{fill:#00d1c1}40%{fill:#8a3dff}60%{fill:#ff3da8}80%{fill:#ff9a2e}100%{fill:#1e6bff}}
.cf-demo-object.chromo-on .cc,.cf-demo-object.power-on:not(.chromo-off) .cc{animation:cfChromo 12s linear infinite}
.cf-demo-object.cf-demo-object.chromo-blue:not(.chromo-off) .cc{animation:none;fill:#1e6bff}
.cf-demo-object.cf-demo-object.chromo-teal:not(.chromo-off) .cc{animation:none;fill:#00d1c1}
.cf-demo-object.cf-demo-object.chromo-violet:not(.chromo-off) .cc{animation:none;fill:#8a3dff}
.cf-demo-object.cf-demo-object.chromo-magenta:not(.chromo-off) .cc{animation:none;fill:#ff3da8}
.cf-demo-object.cf-demo-object.chromo-warm:not(.chromo-off) .cc{animation:none;fill:#ff9a2e}
.cf-demo-object.cf-demo-object.chromo-white:not(.chromo-off) .cc{animation:none;fill:#eaf6ff}
</style>
<defs><radialGradient id="gWarm"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
<radialGradient id="gCyan"><stop offset="0" stop-color="#7ff6ff" stop-opacity=".85"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gGreen"><stop offset="0" stop-color="#5dff8a"/><stop offset=".4" stop-color="#22ff66" stop-opacity=".6"/><stop offset="1" stop-color="#22ff66" stop-opacity="0"/></radialGradient>
<radialGradient id="gRed"><stop offset="0" stop-color="#ff3b30"/><stop offset=".4" stop-color="#ff3b30" stop-opacity=".6"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
<radialGradient id="gWhite"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="gViolet"><stop offset="0" stop-color="#d9b3ff" stop-opacity=".9"/><stop offset="1" stop-color="#8a3dff" stop-opacity="0"/></radialGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff4ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="gHeatBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf70" stop-opacity=".7"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></linearGradient>
<linearGradient id="gF1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb04a"/><stop offset=".5" stop-color="#ff6a1a"/><stop offset="1" stop-color="#d94a10"/></linearGradient>
<linearGradient id="gF2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7bff"/><stop offset=".6" stop-color="#1240c8"/><stop offset="1" stop-color="#0b1f6e"/></linearGradient>
<linearGradient id="gF3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b56cff"/><stop offset=".5" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
<linearGradient id="gF4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4ff"/><stop offset="1" stop-color="#9fb8c8"/></linearGradient>
<pattern id="pCaustic" width="60" height="40" patternUnits="userSpaceOnUse"><path d="M0 20 Q15 5 30 20 T60 20" fill="none" stroke="#e8ffff" stroke-width="2" opacity=".55"/><path d="M0 38 Q15 25 30 38 T60 38" fill="none" stroke="#e8ffff" stroke-width="1.5" opacity=".35"/></pattern>
<filter id="fBlur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="fBlurBig"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="fSoft"><feGaussianBlur stdDeviation=".6"/></filter>
<filter id="fCaus"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="fDepth"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="fFish" x="-20%" y="-30%" width="140%" height="170%"><feColorMatrix type="matrix" values=".9 0 0 0 0  0 .97 .03 0 .01  0 .05 1 0 .03  0 0 0 1 0" result="c"/><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="14" result="b"/><feFlood flood-color="#001a24" flood-opacity=".35"/><feComposite in2="b" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="c"/></feMerge></filter>
<filter id="fFishFar"><feColorMatrix type="matrix" values=".6 .1 .1 0 0  .05 .75 .15 0 .06  .05 .15 .8 0 .1  0 0 0 1 0"/><feGaussianBlur stdDeviation="1.4"/></filter></defs>
<image id="base" href="base.jpg" xlink:href="base.jpg" x="0" y="0" width="1024" height="768" preserveAspectRatio="xMidYMid slice" style="display:none"/>
<g id="overlays">
<clipPath id="cWater"><ellipse cx="538" cy="422" rx="417" ry="95"/></clipPath>
<clipPath id="cRimIn"><ellipse cx="538" cy="415" rx="440" ry="128"/></clipPath><mask id="mRimIn"><rect x="0" y="0" width="1024" height="768" fill="#fff"/><ellipse cx="538" cy="422" rx="417" ry="95" fill="#000"/></mask>
<g id="water" clip-path="url(#cWater)"><rect id="water-tint" x="110" y="320" width="860" height="210" style="mix-blend-mode:soft-light"/></g>
<mask id="mWater"><ellipse cx="538" cy="422" rx="414" ry="93" fill="#fff" filter="url(#fCaus)"/></mask>
<g id="chromo">
<g clip-path="url(#cWater)" mask="url(#mWater)" style="mix-blend-mode:multiply" opacity=".35"><rect class="cc" x="110" y="320" width="860" height="210"/></g>
<g clip-path="url(#cWater)" mask="url(#mWater)" style="mix-blend-mode:color" opacity=".72"><rect class="cc" x="110" y="320" width="860" height="210"/></g>
<g clip-path="url(#cWater)" mask="url(#mWater)" style="mix-blend-mode:screen" opacity=".95"><g filter="url(#fBlurBig)"><ellipse class="cc" cx="255" cy="412" rx="210" ry="70"/><ellipse class="cc" cx="825" cy="415" rx="210" ry="70"/><ellipse class="cc" cx="538" cy="440" rx="330" ry="60" opacity=".75"/><path class="cc" d="M232 392 L420 520 L180 520 Z" opacity=".8"/><path class="cc" d="M850 395 L900 520 L660 520 Z" opacity=".8"/></g></g>
</g>
<g id="chromo-rim" clip-path="url(#cRimIn)" mask="url(#mRimIn)" style="mix-blend-mode:screen"><ellipse class="cc" cx="260" cy="385" rx="200" ry="55" opacity=".95" filter="url(#fBlurBig)"/><ellipse class="cc" cx="820" cy="388" rx="200" ry="55" opacity=".95" filter="url(#fBlurBig)"/><ellipse class="cc" cx="538" cy="330" rx="300" ry="30" opacity=".55" filter="url(#fBlurBig)"/></g>
<g id="chromo-fixtures" style="mix-blend-mode:screen"><circle class="cc" cx="232" cy="388" r="70" opacity=".7" filter="url(#fBlurBig)"/><circle class="cc" cx="232" cy="388" r="30" filter="url(#fBlur)"/><circle cx="232" cy="388" r="11" fill="#fff" opacity=".95" filter="url(#fSoft)"/><circle class="cc" cx="850" cy="391" r="70" opacity=".7" filter="url(#fBlurBig)"/><circle class="cc" cx="850" cy="391" r="30" filter="url(#fBlur)"/><circle cx="850" cy="391" r="11" fill="#fff" opacity=".95" filter="url(#fSoft)"/></g>
<g id="flow" class="ov" style="mix-blend-mode:screen" clip-path="url(#cWater)"><g opacity=".25"><ellipse class="ring" style="animation-delay:0.0s" cx="538" cy="430" rx="160" ry="34" fill="none" stroke="#dff8ff" stroke-width="3" filter="url(#fCaus)"/><ellipse class="ring" style="animation-delay:1.0s" cx="538" cy="430" rx="160" ry="34" fill="none" stroke="#dff8ff" stroke-width="3" filter="url(#fCaus)"/><ellipse class="ring" style="animation-delay:2.0s" cx="538" cy="430" rx="160" ry="34" fill="none" stroke="#dff8ff" stroke-width="3" filter="url(#fCaus)"/></g></g>
<g id="mist" class="ov"><ellipse class="puff" style="animation-delay:0.0s" cx="230" cy="330" rx="120" ry="34" fill="#fff" opacity=".22" filter="url(#fBlurBig)"/><ellipse class="puff" style="animation-delay:0.6s" cx="380" cy="305" rx="120" ry="34" fill="#fff" opacity=".22" filter="url(#fBlurBig)"/><ellipse class="puff" style="animation-delay:1.2s" cx="530" cy="330" rx="120" ry="34" fill="#fff" opacity=".22" filter="url(#fBlurBig)"/><ellipse class="puff" style="animation-delay:1.8s" cx="680" cy="305" rx="120" ry="34" fill="#fff" opacity=".22" filter="url(#fBlurBig)"/><ellipse class="puff" style="animation-delay:2.4s" cx="830" cy="330" rx="120" ry="34" fill="#fff" opacity=".22" filter="url(#fBlurBig)"/></g>
<g id="display" class="ov"><rect x="826" y="604" width="104" height="40" rx="8" fill="#0a1a22" opacity=".88"/><text x="866" y="631" fill="#7ff6ff" font-family="monospace" font-size="20" text-anchor="middle">39°F</text></g>
<circle id="led-power" class="ov" cx="912" cy="616" r="5" fill="url(#gGreen)"/>
<circle id="led-chiller" class="ov" cx="912" cy="632" r="5" fill="url(#gCyan)"/>
<circle id="led-chromo" class="ov cc" cx="840" cy="624" r="4"/>
</g>
</svg>
