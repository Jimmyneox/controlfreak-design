<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 768" class="cf-demo-object o04-reef swim-on" data-object="o04-reef">
<style>
.cf-demo-object{display:block;width:100%;height:auto}
.cf-demo-object .ov{opacity:0;transition:opacity .6s ease}
.cf-demo-object #water{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s ease}
@keyframes cfShimmer{0%{transform:translateX(-12px)}50%{transform:translateX(12px)}100%{transform:translateX(-12px)}}
@keyframes cfPulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes cfRise{0%{transform:translateY(0)}100%{transform:translateY(-20px)}}
@keyframes cfRipple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes cfSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.cf-demo-object .shimmer{animation:cfShimmer 4s ease-in-out infinite}
.cf-demo-object.swim-off *{animation-play-state:paused!important}
@keyframes cfSwimR{0%{transform:translateX(-200px)}100%{transform:translateX(1224px)}}
@keyframes cfSwimL{0%{transform:translateX(1224px)}100%{transform:translateX(-200px)}}
@keyframes cfBob{0%,100%{transform:translateY(-8px) rotate(-1.5deg)}50%{transform:translateY(10px) rotate(2deg)}}
@keyframes cfUndulate{0%,100%{transform:skewY(-1.6deg) scaleX(1)}50%{transform:skewY(1.6deg) scaleX(.97)}}
.cf-demo-object .fish{transform:translateX(-200px)}
.cf-demo-object.swim-on .fish{animation-timing-function:linear;animation-iteration-count:infinite}
.cf-demo-object.swim-on .fish .bob{animation:cfBob 3.2s ease-in-out infinite}
.cf-demo-object .fish .body{transform-box:fill-box;transform-origin:65% 50%}
.cf-demo-object.swim-on .fish .body{animation:cfUndulate .7s ease-in-out infinite}
.cf-demo-object.swim-off .fish{animation-play-state:paused}
.cf-demo-object.light-on #light-glow,.cf-demo-object.light-on #light-beam{opacity:1}
.cf-demo-object.pump-on #flow{opacity:.35}
.cf-demo-object.heater-on #heater-glow{opacity:1}
.cf-demo-object.heater-on #status-heater,.cf-demo-object.pump-on #status-pump,.cf-demo-object.light-on #status-light{opacity:1;animation:cfPulse 2s infinite}
</style>
<defs><radialGradient id="gWarm"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
<radialGradient id="gCyan"><stop offset="0" stop-color="#7ff6ff" stop-opacity=".85"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gGreen"><stop offset="0" stop-color="#5dff8a"/><stop offset=".4" stop-color="#22ff66" stop-opacity=".6"/><stop offset="1" stop-color="#22ff66" stop-opacity="0"/></radialGradient>
<radialGradient id="gRed"><stop offset="0" stop-color="#ff3b30"/><stop offset=".4" stop-color="#ff3b30" stop-opacity=".6"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
<radialGradient id="gWhite"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="gViolet"><stop offset="0" stop-color="#d9b3ff" stop-opacity=".9"/><stop offset="1" stop-color="#8a3dff" stop-opacity="0"/></radialGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff4ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="gHeatBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf70" stop-opacity=".7"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></linearGradient>
<linearGradient id="gF1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb04a"/><stop offset=".5" stop-color="#ff6a1a"/><stop offset="1" stop-color="#d94a10"/></linearGradient>
<linearGradient id="gF2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7bff"/><stop offset=".6" stop-color="#1240c8"/><stop offset="1" stop-color="#0b1f6e"/></linearGradient>
<linearGradient id="gF3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b56cff"/><stop offset=".5" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
<linearGradient id="gF4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4ff"/><stop offset="1" stop-color="#9fb8c8"/></linearGradient>
<pattern id="pCaustic" width="60" height="40" patternUnits="userSpaceOnUse"><path d="M0 20 Q15 5 30 20 T60 20" fill="none" stroke="#e8ffff" stroke-width="2" opacity=".55"/><path d="M0 38 Q15 25 30 38 T60 38" fill="none" stroke="#e8ffff" stroke-width="1.5" opacity=".35"/></pattern>
<filter id="fBlur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="fBlurBig"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="fSoft"><feGaussianBlur stdDeviation=".6"/></filter>
<filter id="fCaus"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="fDepth"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="fFish" x="-20%" y="-30%" width="140%" height="170%"><feColorMatrix type="matrix" values=".9 0 0 0 0  0 .97 .03 0 .01  0 .05 1 0 .03  0 0 0 1 0" result="c"/><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="14" result="b"/><feFlood flood-color="#001a24" flood-opacity=".35"/><feComposite in2="b" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="c"/></feMerge></filter>
<filter id="fFishFar"><feColorMatrix type="matrix" values=".6 .1 .1 0 0  .05 .75 .15 0 .06  .05 .15 .8 0 .1  0 0 0 1 0"/><feGaussianBlur stdDeviation="1.4"/></filter></defs>
<image id="base" href="base.jpg" xlink:href="base.jpg" x="0" y="0" width="1024" height="768" preserveAspectRatio="xMidYMid slice"/>
<g id="overlays">
<g id="water"><rect x="0" y="0" width="1024" height="768" fill="#1ec8d8" opacity=".08" style="mix-blend-mode:screen"/></g>
<g id="fish-school"><g id="fish-4" class="fish" data-species="chromis" style="animation-duration:34s;animation-delay:-14s;animation-name:cfSwimL">
<g transform="translate(0 190)"><g class="bob" style="animation-delay:-4.7s"><g transform="scale(-1,1)"><g class="body" style="animation-delay:-2.80s"><image href="fish/chromis.png" xlink:href="fish/chromis.png" x="-35" y="-16" width="70" height="32" filter="url(#fFishFar)" opacity=".8"/></g></g></g></g></g><g id="fish-6" class="fish" data-species="chromis" style="animation-duration:38s;animation-delay:-25s;animation-name:cfSwimR">
<g transform="translate(0 230)"><g class="bob" style="animation-delay:-8.3s"><g transform="scale(1)"><g class="body" style="animation-delay:-5.00s"><image href="fish/chromis.png" xlink:href="fish/chromis.png" x="-29" y="-13" width="58" height="26" filter="url(#fFishFar)" opacity=".8"/></g></g></g></g></g><g id="fish-2" class="fish" data-species="blue-tang" style="animation-duration:24s;animation-delay:-9s;animation-name:cfSwimL">
<g transform="translate(0 260)"><g class="bob" style="animation-delay:-3.0s"><g transform="scale(-1,1)"><g class="body" style="animation-delay:-1.80s"><image href="fish/blue-tang.png" xlink:href="fish/blue-tang.png" x="-95" y="-45" width="190" height="90" filter="url(#fFish)"/></g></g></g></g></g><g id="fish-1" class="fish" data-species="clownfish" style="animation-duration:18s;animation-delay:0s;animation-name:cfSwimR">
<g transform="translate(0 340)"><g class="bob" style="animation-delay:0.0s"><g transform="scale(1)"><g class="body" style="animation-delay:0.00s"><image href="fish/clownfish.png" xlink:href="fish/clownfish.png" x="-60" y="-34" width="120" height="68" filter="url(#fFish)"/></g></g></g></g></g><g id="fish-3" class="fish" data-species="royal-gramma" style="animation-duration:21s;animation-delay:-6s;animation-name:cfSwimR">
<g transform="translate(0 440)"><g class="bob" style="animation-delay:-2.0s"><g transform="scale(1)"><g class="body" style="animation-delay:-1.20s"><image href="fish/royal-gramma.png" xlink:href="fish/royal-gramma.png" x="-48" y="-22" width="95" height="45" filter="url(#fFish)"/></g></g></g></g></g><g id="fish-5" class="fish" data-species="yellow-tang" style="animation-duration:27s;animation-delay:-17s;animation-name:cfSwimL">
<g transform="translate(0 300)"><g class="bob" style="animation-delay:-5.7s"><g transform="scale(-1,1)"><g class="body" style="animation-delay:-3.40s"><image href="fish/yellow-tang.png" xlink:href="fish/yellow-tang.png" x="-75" y="-48" width="150" height="95" filter="url(#fFish)"/></g></g></g></g></g></g>
<g id="light-beam" class="ov" style="mix-blend-mode:screen"><path d="M120 0 L904 0 L1024 768 L0 768 Z" fill="url(#gBeam)"/></g>
<g id="light-glow" class="ov" style="mix-blend-mode:screen"><ellipse cx="512" cy="40" rx="480" ry="60" fill="url(#gCyan)" filter="url(#fBlur)"/><ellipse cx="512" cy="300" rx="480" ry="240" fill="url(#gCyan)" opacity=".3" filter="url(#fBlurBig)"/></g>
<g id="flow" class="ov" style="mix-blend-mode:screen"><clipPath id="cWater04"><rect x="0" y="0" width="1024" height="260"/></clipPath><g clip-path="url(#cWater04)" filter="url(#fCaus)"><rect class="shimmer" x="-30" y="0" width="1084" height="260" fill="url(#pCaustic)"/></g></g>
<g id="heater-glow" class="ov" style="mix-blend-mode:screen"><ellipse cx="985" cy="330" rx="26" ry="110" fill="url(#gWarm)" filter="url(#fBlur)"/></g>
<g id="status"><circle id="status-light" class="ov" cx="40" cy="730" r="8" fill="url(#gGreen)"/><circle id="status-pump" class="ov" cx="64" cy="730" r="8" fill="url(#gGreen)"/><circle id="status-heater" class="ov" cx="88" cy="730" r="8" fill="url(#gWarm)"/></g>
</g>
</svg>
